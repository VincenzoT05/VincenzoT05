name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cards_ready: ${{ steps.mark-ready.outputs.cards_ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check stats token
        shell: bash
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [[ -z "$PROFILE_STATS_TOKEN" ]]; then
            echo "::error::Add the PROFILE_STATS_TOKEN repository secret."
            exit 1
          fi

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=VincenzoT05&show_icons=true&include_all_commits=true&show=contributions,all_time_contribs&hide=issues,contribs&hide_rank=true&hide_title=true&card_width=300&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=VincenzoT05&layout=compact&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - id: mark-ready
        run: echo "cards_ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-cards
          path: profile/*.svg
          if-no-files-found: error
          retention-days: 1

  publish-cards:
    needs: generate-cards
    if: needs.generate-cards.outputs.cards_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-cards
          path: profile

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "Update profile cards"
          git push